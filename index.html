
<div id="rr-widget">
<style>
@import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap');

#rr-widget {
  font-family:Montserrat,sans-serif;
  color:#2cefac;
  width:100%;
  max-width:850px;
  margin:auto;
}

#rr-widget * {
  box-sizing:border-box;
}

#rr-widget .panel {
  background:transparent;
  border:2px solid #2cefac;
  border-left:6px solid #2cefac;
  border-radius:12px;
  padding:22px;
  box-shadow:0 0 14px rgba(44,239,172,.15);
}

#rr-widget .header {
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
  gap:10px;
}

#rr-widget .brand {
  font-size:17px;
  font-weight:900;
  letter-spacing:2px;
  color:#FFFFFF;
}

#rr-widget .nick {
  color:#2cefac;
  font-size:20px;
  margin-top:7px;
  font-weight:900;
  letter-spacing:2px;
  text-transform:uppercase;
  text-shadow:0 0 10px rgba(44,239,172,.4);
  overflow-wrap:anywhere;
}

#rr-widget .live {
  font-size:10px;
  color:#2cefac;
  font-weight:800;
  white-space:nowrap;
}

#rr-widget .stats {
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:12px;
}

#rr-widget .stat {
  background:rgba(44,239,172,.045);
  border:1px solid rgba(44,239,172,.45);
  padding:16px 8px;
  border-radius:8px;
  text-align:center;
  min-width:0;
}

#rr-widget .label {
  color:#FFFFFF;
  font-size:10px;
  font-weight:800;
  letter-spacing:1px;
  white-space:nowrap;
}

#rr-widget .change {
  display:inline-block;
  margin-left:3px;
  font-size:10px;
  font-weight:900;
  letter-spacing:0;
}

#rr-widget .positive {
  color:#2cefac;
}

#rr-widget .negative {
  color:#ff4058;
}

#rr-widget .neutral {
  color:#FFFFFF;
}

#rr-widget .number {
  color:#2cefac;
  font-size:clamp(21px,4vw,34px);
  font-weight:900;
  margin-top:9px;
  white-space:nowrap;
  overflow:hidden;
}

#rr-widget .footer {
  display:flex;
  justify-content:space-between;
  margin-top:14px;
  color:#2cefac;
  font-size:9px;
  gap:8px;
}

@media(max-width:480px) {
  #rr-widget .panel {
    padding:13px;
  }

  #rr-widget .stats {
    gap:6px;
  }

  #rr-widget .stat {
    padding:13px 4px;
  }

  #rr-widget .label {
    font-size:8px;
    letter-spacing:.3px;
  }

  #rr-widget .change {
    font-size:8px;
    margin-left:1px;
  }

  #rr-widget .nick {
    font-size:17px;
  }
}
</style>

<div class="panel">
  <div class="header">
    <div>
      <div class="brand">RACEROOM RANKED</div>
      <div class="nick" id="rr-name">Cargando nombre...</div>
    </div>
    <div class="live">● LIVE</div>
  </div>

  <div class="stats">

    <div class="stat">
      <div class="label">
        RATING
        <span class="change neutral" id="rr-rating-change">--</span>
      </div>
      <div class="number" id="rr-rating">---</div>
    </div>

    <div class="stat">
      <div class="label">
        REPUTACIÓN
        <span class="change neutral" id="rr-rep-change">--</span>
      </div>
      <div class="number" id="rr-rep">---</div>
    </div>

    <div class="stat">
      <div class="label">
        GLOBAL
        <span class="change neutral" id="rr-position-change">--</span>
      </div>
      <div class="number" id="rr-position">---</div>
    </div>

  </div>

  <div class="footer">
    <span id="rr-status">Conectando...</span>
    <span id="rr-time">--:--:--</span>
  </div>
</div>
</div>

<script>
(() => {

  const PILOT_NICK = "Borja Zazo";
  const API = "https://game.raceroom.com/multiplayer-rating/ratings.json";
  const INTERVAL = 60000;

  const $ = id => document.getElementById(id);

  // Valores de la actualización anterior
  let previous = {
    rating: null,
    rep: null,
    position: null
  };

  const normalize = s => String(s ?? "")
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase().trim();

  const cleanKey = s =>
    normalize(s).replace(/[^a-z0-9]/g,"");

  function getField(obj, aliases) {
    if (!obj || typeof obj !== "object") return null;

    for (const [key,value] of Object.entries(obj)) {
      if (
        aliases.includes(cleanKey(key)) &&
        value !== null &&
        value !== ""
      ) return value;
    }

    return null;
  }

  function num(value) {
    if (typeof value === "number") return value;

    if (typeof value === "string") {
      const n = Number(value.replace(",","."));
      return Number.isFinite(n) ? n : null;
    }

    return null;
  }

  function findPlayers(data) {

    const result = [];
    const visited = new WeakSet();

    const nameKeys = [
      "username","playername","drivername",
      "nickname","name"
    ];

    const fullNameKeys = [
      "fullname","displayname"
    ];

    const ratingKeys = [
      "rating","rankedrating","mprating",
      "elo","skillrating"
    ];

    const repKeys = [
      "reputation","rep","rankedreputation",
      "mpreputation","safetyrating"
    ];

    const posKeys = [
      "position","globalposition","globalrank",
      "worldrank","rank","place"
    ];

    function walk(node,depth) {

      if (
        !node ||
        typeof node !== "object" ||
        depth > 12 ||
        visited.has(node)
      ) return;

      visited.add(node);

      if (Array.isArray(node)) {
        node.forEach(x => walk(x,depth+1));
        return;
      }

      const name = getField(node,nameKeys);
      const fullname = getField(node,fullNameKeys);
      const rating = num(getField(node,ratingKeys));
      const rep = num(getField(node,repKeys));
      const pos = num(getField(node,posKeys));

      if (name != null && rating != null && rep != null) {

        result.push({
          name:String(name),
          fullname:fullname != null ? String(fullname) : null,
          rating,
          rep,
          pos
        });

      }

      Object.values(node).forEach(x => {
        if (x && typeof x === "object") {
          walk(x,depth+1);
        }
      });
    }

    walk(data,0);

    return result;
  }

  // Calcula y muestra las variaciones
  function updateChange(id,current,old,invert=false) {

    const element = $(id);

    if (old === null || old === undefined || current === null) {
      element.textContent = "--";
      element.className = "change neutral";
      return;
    }

    // En GLOBAL, bajar de número de posición significa mejorar
    const difference = invert
      ? old - current
      : current - old;

    if (difference === 0) {
      element.textContent = "● 0";
      element.className = "change neutral";
      return;
    }

    const sign = difference > 0 ? "+" : "";
    const arrow = difference > 0 ? "▲" : "▼";

    element.textContent =
      arrow + " " + sign +
      difference.toLocaleString("es-ES");

    element.className = difference > 0
      ? "change positive"
      : "change negative";
  }

  async function update() {

    try {

      const response = await fetch(
        API + "?t=" + Date.now(),
        {cache:"no-store"}
      );

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      const data = await response.json();
      const players = findPlayers(data);

      if (!players.length) {
        throw new Error("Estructura JSON no reconocida");
      }

      const pilot = players.find(
        p => normalize(p.name) === normalize(PILOT_NICK)
      );

      if (!pilot) {
        throw new Error("Piloto " + PILOT_NICK + " no encontrado");
      }

      let position = pilot.pos;

      if (position == null) {

        const sorted = [...players].sort(
          (a,b) => b.rating-a.rating
        );

        position = sorted.findIndex(
          p => normalize(p.name) === normalize(pilot.name)
        ) + 1;

      }

      // Mostrar nombre y estadísticas
      $("rr-name").textContent =
        pilot.fullname || pilot.name || "Nombre no disponible";

      $("rr-rating").textContent =
        pilot.rating.toLocaleString("es-ES");

      $("rr-rep").textContent =
        pilot.rep.toLocaleString("es-ES");

      $("rr-position").textContent =
        position > 0 ? "#" + position : "---";

      // Comparar con los valores anteriores
      updateChange(
        "rr-rating-change",
        pilot.rating,
        previous.rating
      );

      updateChange(
        "rr-rep-change",
        pilot.rep,
        previous.rep
      );

      updateChange(
        "rr-position-change",
        position > 0 ? position : null,
        previous.position,
        true
      );

      // Guardar valores para la próxima actualización
      previous.rating = pilot.rating;
      previous.rep = pilot.rep;
      previous.position = position > 0 ? position : null;

      $("rr-status").textContent = "Datos actualizados";

      $("rr-time").textContent =
        new Date().toLocaleTimeString("es-ES");

    } catch(error) {

      console.error("RaceRoom:",error);

      $("rr-status").textContent =
        "Error de conexión / CORS";

    }
  }

  update();
  setInterval(update,INTERVAL);

})();
</script>
